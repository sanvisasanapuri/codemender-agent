steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud artifacts generic download \
          --project=cmoc-prod \
          --location=us \
          --repository=codemender-cli-production \
          --package=cm \
          --version=stable \
          --name=cm-linux-amd64.zip \
          --destination=./ 2>/dev/null; then
          python3 -m zipfile -e cm-linux-amd64.zip ./
          chmod +x cm
        else
          echo "Using cm_shim.py for Argolis build..."
          cp cm_shim.py cm
          chmod +x cm
        fi
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/orchestrator:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/orchestrator:latest']
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/orchestrator:latest'
substitutions:
  _REPO_NAME: 'codemender-runner'
  _REGION: 'us-central1'
